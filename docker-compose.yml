# Container output (`docker compose logs`, Grafana → Loki) — capped so it
# can't fill the disk: 5 files × 20 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  db:
    logging: *default-logging
    image: postgis/postgis:16-3.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped


  web:
    logging: *default-logging
    build: .
    command: gunicorn config.asgi:application -c config/gunicorn.conf.py -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers 4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Combine the 4 workers' metrics for Grafana (api/core/metrics.py).
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-metrics
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - tmp_uploads_volume:/app/tmp_uploads
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8000:8000"

  celery:
    logging: *default-logging
    build: .
    # -E: send task events (Flower turns them into Grafana metrics).
    command: celery -A config worker -B -E -l info
    volumes:
      - .:/app
      - tmp_uploads_volume:/app/tmp_uploads
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file:
      - .env
    restart: always


  # Nightly database + media backup to off-site storage (Backblaze B2 / any
  # S3-compatible bucket), weekly retention + check, monthly restore test.
  # Setup and restore steps: docs/backups.md.
  backup:
    logging: *default-logging
    build: ./backup
    env_file:
      - .env
    volumes:
      - media_volume:/media:ro
      - backup_metrics:/metrics          # read by node-exporter (Grafana alerts)
      - backup_cache:/root/.cache/restic # restic cache: faster backups
    depends_on:
      - db
    restart: unless-stopped


volumes:
  postgres_data:
  static_volume:
  media_volume:
  tmp_uploads_volume:
  backup_metrics:
  backup_cache:
