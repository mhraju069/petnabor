# Optional: Grafana on its own HTTPS address, e.g. https://monitor.petnabor.com
#
# 1. DNS: an A record for monitor.petnabor.com → this server.
# 2. Certificate:  sudo certbot certonly --nginx -d monitor.petnabor.com
# 3. Copy to /etc/nginx/sites-available/monitor.petnabor.com, symlink it into
#    sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
# 4. In .env:  GRAFANA_ROOT_URL=https://monitor.petnabor.com  and restart grafana.
#
# Grafana keeps its own login. Prometheus (9090) and Flower (5555) stay
# private — use an SSH tunnel for those.

server {
    listen 80;
    server_name monitor.petnabor.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name monitor.petnabor.com;

    ssl_certificate /etc/letsencrypt/live/monitor.petnabor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.petnabor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Grafana Live (dashboard auto-refresh over a websocket).
    location /api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
