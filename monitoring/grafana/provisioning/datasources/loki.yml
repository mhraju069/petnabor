apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # "req=<id>" in a log line becomes a clickable filter for that request.
      derivedFields:
        - name: Request
          matcherRegex: "req=([0-9A-Za-z._-]{6,64})"
          datasourceUid: loki
          url: '{service=~".+"} |= "req=$${__value.raw}"'
